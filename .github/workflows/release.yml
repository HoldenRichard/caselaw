# Publish to npm with provenance.
#
# Provenance is a signed attestation linking the published tarball to the exact
# commit and workflow run that produced it. Without it, "this package came from
# this source" is something you take on trust; with it, anyone can verify it.
# For a tool whose entire pitch is that claims should be checkable, publishing
# on trust would be an odd look.
#
# It requires three things, and all three are easy to get wrong:
#   - id-token: write        so the runner can request a Sigstore token
#   - a public repo          provenance is not available for private repos
#   - `repository` in        the URL must match the repo doing the publishing
#     package.json
#
# Triggered by pushing a tag: git tag v0.1.1 && git push origin v0.1.1
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # required for provenance; the publish silently loses it otherwise

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      # Nothing to install — zero dependencies. Run the suite anyway: a release
      # is the worst possible moment to discover the tests were red.
      - run: node --test 'test/unit/*.test.js'

      # The tool must pass its own audit before it ships. A governance tool
      # whose own governance is stale has already lost the argument.
      - run: node bin/cli.mjs audit .

      # The tag must match the version being published. Publishing v0.1.1 from
      # a tree that says 0.1.0 produces a release nobody can trace back.
      - name: Tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./package.json').version")
          if [ "$TAG" != "$PKG" ]; then
            echo "tag v$TAG does not match package.json $PKG"
            exit 1
          fi
          echo "v$TAG matches package.json"

      - name: Publish with provenance
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
