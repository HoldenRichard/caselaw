# Publish npm with provenance; GitHub Packages is an explicit manual choice.
#
# Provenance is a signed attestation linking the published tarball to the exact
# commit and workflow run that produced it.
#
# Triggered by pushing a tag: git tag v0.3.0 && git push origin v0.3.0
# or via manual workflow_dispatch in GitHub Actions.

name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      target:
        description: Registry to publish to
        type: choice
        default: npm
        options:
          - npm
          - github
          - both

permissions:
  contents: read
  id-token: write # required for npm provenance
  packages: write # required to publish to GitHub Packages

jobs:
  github-packages:
    if: github.event_name == 'workflow_dispatch' && inputs.target != 'npm'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@holdenrichard'

      - run: node --test test/unit/*.test.js
      - run: node bin/cli.mjs audit .

      - name: Publish to GitHub Packages
        run: |
          node -e "
            const pkg = require('./package.json');
            pkg.name = '@holdenrichard/caselaw';
            pkg.publishConfig = { registry: 'https://npm.pkg.github.com' };
            require('fs').writeFileSync('./package.json', JSON.stringify(pkg, null, 2) + '\n');
          "
          npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  npm-release:
    if: github.event_name != 'workflow_dispatch' || inputs.target != 'github'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Ensure npm 11.5.1 or later for trusted publishing
        run: npm install -g npm@11.16.0

      - run: node --test test/unit/*.test.js
      - run: node bin/cli.mjs audit .

      - name: Tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./package.json').version")
          if [ "$TAG" != "$PKG" ]; then
            echo "tag v$TAG does not match package.json $PKG"
            exit 1
          fi
          echo "v$TAG matches package.json"

      - name: Publish with provenance
        run: npm publish --provenance --access public
